<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Adjudicate competing abstractions of medical reports and build a consensus gold standard — entirely in your browser." />
    <meta name="color-scheme" content="light dark" />
    <title>Gold Standard Resolver</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply the saved theme before first paint (avoids a flash).
      try {
        var t = localStorage.getItem('gold-standard-resolver:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>This app needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
